<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="profile">
    <img src="avatar.jpeg" alt="Profile" class="profile-img">

    <h2>Jessica Randall</h2>
    <p class="location">London, United Kingdom</p>
    <p class="bio">"Front-end developer and avid reader."</p>

    <div class="links">
      <button onclick="openLink('https://github.com/')">GitHub</button>
      <button onclick="openLink('https://www.frontendmentor.io')">Frontend Mentor</button>
      <button onclick="https://in.linkedin.com/">LinkedIn</button>
      <button onclick="openLink('https://twitter.com')">Twitter</button>
      <button onclick="openLink('https://instagram.com')">Instagram</button>
    </div>
  </div>

</body>
</html>
